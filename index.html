<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SOFC参数试验台账</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, Microsoft Yahei}
body{background:#f5f7fa;color:#222;padding-bottom:80px;min-height:100vh}
.container{max-width:760px;margin:0 auto;padding:12px}
/* 功能按钮组 */
.btn-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.btn-block{padding:11px;border:none;border-radius:10px;font-size:15px;color:#fff}
.btn-blue{background:#2980b9}
.btn-green{background:#27ae60}
.btn-orange{background:#e67e22}
.btn-gray{background:#95a5a6}
.btn-red{background:#e74c3c}
.btn-light{background:#dde3ec;color:#222}
/* 搜索区域 */
.search-box{display:flex;gap:8px;margin-bottom:14px}
.search-box input{flex:1;padding:10px 12px;border:1px solid #dcdfe6;border-radius:10px;font-size:16px}
/* 记录卡片 */
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 5px #00000010}
.card-date{font-size:13px;color:#777;margin-bottom:6px}
.card-title{font-weight:bold;margin:8px 0 4px}
.card-text{font-size:15px;line-height:1.5;margin-bottom:6px}
.card-btn-group{display:flex;gap:8px;margin-top:10px}
.card-edit{padding:6px 12px;background:#e8f0fe;border:none;border-radius:8px;color:#2980b9}
.card-del{padding:6px 12px;background:#ecf0f1;border:none;border-radius:8px;color:#c0392b}
/* 弹窗通用样式（手机全屏弹窗） */
.pop{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;padding:16px;overflow-y:auto}
.pop-content{background:#fff;border-radius:14px;padding:16px;max-width:720px;margin:0 auto}
.pop h3{margin-bottom:14px}
.pop label{display:block;margin:10px 0 4px;font-weight:500}
.pop textarea{width:100%;min-height:120px;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}
.pop input{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin-bottom:6px}
.pop .line-btn{display:flex;gap:10px;margin-top:16px}
.pop textarea.report{min-height:240px;background:#f7f8fa}
.tip-text{color:#666;font-size:14px;margin:8px 0}
.highlight{background:#fff280}
</style>
</head>
<body>
<div class="container">
    <!-- 搜索 -->
    <div class="search-box">
        <input id="searchKey" placeholder="全局搜索参数、试验目的、试验结果">
        <button class="btn-block btn-blue" style="width:90px" id="searchBtn">搜索</button>
    </div>
    <div class="tip-text" id="searchTip"></div>
    <!-- 功能按钮 -->
    <div class="btn-row">
        <button class="btn-block btn-blue" id="addBtn">新增记录</button>
        <button class="btn-block btn-green" id="exportBtn">导出台账</button>
        <button class="btn-block btn-gray" id="resetSearch">清除搜索</button>
    </div>
    <div class="btn-row">
        <button class="btn-block btn-orange" id="weekBtn">生成周报</button>
        <button class="btn-block btn-orange" id="monthBtn">生成月报</button>
        <div></div>
    </div>
    <!-- 记录列表 -->
    <div id="listWrap"></div>
</div>
<!-- 新增记录弹窗 -->
<div class="pop" id="popAdd">
    <div class="pop-content">
        <h3>新增参数试验记录</h3>
        <label>参数记录</label>
        <textarea id="inpParam" placeholder="填写本次试验全部运行参数、样品规格、工况条件"></textarea>
        <label>试验目的</label>
        <textarea id="inpPurpose" placeholder="本次试验要验证、测试、优化的目标"></textarea>
        <label>试验结果</label>
        <textarea id="inpResult" placeholder="实测数据、性能表现、合格/异常结论"></textarea>
        <div class="line-btn">
            <button class="btn-block btn-blue" id="saveRecord">保存</button>
            <button class="btn-block btn-gray" id="closeAdd">取消</button>
        </div>
    </div>
</div>
<!-- 编辑记录弹窗 -->
<div class="pop" id="popEdit">
    <div class="pop-content">
        <h3>修改参数试验记录</h3>
        <label>参数记录</label>
        <textarea id="editParam"></textarea>
        <label>试验目的</label>
        <textarea id="editPurpose"></textarea>
        <label>试验结果</label>
        <textarea id="editResult"></textarea>
        <input type="hidden" id="editIndex">
        <div class="line-btn">
            <button class="btn-block btn-blue" id="saveEdit">确认修改</button>
            <button class="btn-block btn-gray" id="closeEdit">取消</button>
        </div>
    </div>
</div>
<!-- 周报弹窗 -->
<div class="pop" id="popWeek">
    <div class="pop-content">
        <h3>自动生成周报汇总</h3>
        <label>起始日期</label>
        <input type="date" id="wStart">
        <label>结束日期</label>
        <input type="date" id="wEnd">
        <button class="btn-block btn-blue" style="width:100%;margin:8px 0" id="buildWeek">生成汇总周报</button>
        <textarea readonly class="report" id="weekResult"></textarea>
        <div class="line-btn">
            <button class="btn-block btn-green" id="copyWeek">复制文本</button>
            <button class="btn-block btn-gray" id="closeWeek">关闭</button>
        </div>
    </div>
</div>
<!-- 月报弹窗 -->
<div class="pop" id="popMonth">
    <div class="pop-content">
        <h3>自动生成月报汇总</h3>
        <label>选择月份</label>
        <input type="month" id="selMonth">
        <button class="btn-block btn-blue" style="width:100%;margin:8px 0" id="buildMonth">生成汇总月报</button>
        <textarea readonly class="report" id="monthResult"></textarea>
        <div class="line-btn">
            <button class="btn-block btn-green" id="copyMonth">复制文本</button>
            <button class="btn-block btn-gray" id="closeMonth">关闭</button>
        </div>
    </div>
</div>
<script>
let searchWord = "";
// 单个数组存储全部记录，无分类
let recordList = JSON.parse(localStorage.getItem("sofcParamLogSimple")) || [];
//DOM元素
const listWrap = document.getElementById("listWrap");
const searchKey = document.getElementById("searchKey");
const searchBtn = document.getElementById("searchBtn");
const resetSearch = document.getElementById("resetSearch");
const searchTip = document.getElementById("searchTip");
const popAdd = document.getElementById("popAdd");
const inpParam = document.getElementById("inpParam");
const inpPurpose = document.getElementById("inpPurpose");
const inpResult = document.getElementById("inpResult");
const addBtn = document.getElementById("addBtn");
const saveRecord = document.getElementById("saveRecord");
const closeAdd = document.getElementById("closeAdd");
//编辑弹窗
const popEdit = document.getElementById("popEdit");
const editParam = document.getElementById("editParam");
const editPurpose = document.getElementById("editPurpose");
const editResult = document.getElementById("editResult");
const editIndex = document.getElementById("editIndex");
const saveEdit = document.getElementById("saveEdit");
const closeEdit = document.getElementById("closeEdit");
const exportBtn = document.getElementById("exportBtn");
//周报
const popWeek = document.getElementById("popWeek");
const weekBtn = document.getElementById("weekBtn");
const wStart = document.getElementById("wStart");
const wEnd = document.getElementById("wEnd");
const buildWeek = document.getElementById("buildWeek");
const weekResult = document.getElementById("weekResult");
const copyWeek = document.getElementById("copyWeek");
const closeWeek = document.getElementById("closeWeek");
//月报
const popMonth = document.getElementById("popMonth");
const monthBtn = document.getElementById("monthBtn");
const selMonth = document.getElementById("selMonth");
const buildMonth = document.getElementById("buildMonth");
const monthResult = document.getElementById("monthResult");
const copyMonth = document.getElementById("copyMonth");
const closeMonth = document.getElementById("closeMonth");

//保存本地存储
function saveStorage(){
    localStorage.setItem("sofcParamLogSimple",JSON.stringify(recordList));
}
//文字高亮
function highlight(str,key){
    if(!key) return str;
    return str.replace(new RegExp(`(${key})`,"gi"),`<span class="highlight">$1</span>`);
}
//渲染列表（数组天然新记录在上，无需排序）
function renderList(){
    listWrap.innerHTML = "";
    searchTip.innerText = "";
    //搜索模式
    if(searchWord.trim()!=""){
        let result = recordList.filter(item=>{
            const allTxt = (item.param+item.purpose+item.result).toLowerCase();
            return allTxt.includes(searchWord.toLowerCase());
        })
        if(result.length===0){
            listWrap.innerHTML = `<div class="card">未搜索到匹配记录</div>`;
            return;
        }
        searchTip.innerText = `搜索【${searchWord}】共找到${result.length}条`;
        result.forEach((item,idx)=>renderCard(idx,item));
        return;
    }
    //正常展示，数组头部为最新记录
    if(recordList.length===0){
        listWrap.innerHTML = `<div class="card">暂无记录，请点击新增记录</div>`;
        return;
    }
    recordList.forEach((item,idx)=>renderCard(idx,item));
}
//渲染单条卡片
function renderCard(idx,item){
    const div = document.createElement("div");
    div.className="card";
    div.innerHTML = `
        <div class="card-date">${item.date}</div>
        <div class="card-title">参数记录</div>
        <div class="card-text">${highlight(item.param||"-",searchWord)}</div>
        <div class="card-title">试验目的</div>
        <div class="card-text">${highlight(item.purpose||"-",searchWord)}</div>
        <div class="card-title">试验结果</div>
        <div class="card-text">${highlight(item.result||"-",searchWord)}</div>
        <div class="card-btn-group">
            <button class="card-edit" data-idx="${idx}">编辑</button>
            <button class="card-del" data-idx="${idx}">删除</button>
        </div>
    `;
    listWrap.appendChild(div);
}
//卡片编辑删除事件
listWrap.onclick = e=>{
    const target = e.target;
    const idx = Number(target.dataset.idx);
    if(target.classList.contains("card-edit")){
        const data = recordList[idx];
        editIndex.value = idx;
        editParam.value = data.param;
        editPurpose.value = data.purpose;
        editResult.value = data.result;
        popEdit.style.display = "block";
    }else if(target.classList.contains("card-del")){
        if(confirm("确定删除这条记录？")){
            recordList.splice(idx,1);
            saveStorage();
            renderList();
        }
    }
}
//保存修改
saveEdit.onclick = ()=>{
    const i = Number(editIndex.value);
    recordList[i].param = editParam.value.trim();
    recordList[i].purpose = editPurpose.value.trim();
    recordList[i].result = editResult.value.trim();
    saveStorage();
    popEdit.style.display="none";
    renderList();
    alert("修改已保存");
}
closeEdit.onclick = ()=>popEdit.style.display="none";
//搜索
searchBtn.onclick = ()=>{
    searchWord = searchKey.value.trim();
    renderList();
}
searchKey.onkeydown = e=>{
    if(e.key=="Enter"){
        searchWord = searchKey.value.trim();
        renderList();
    }
}
resetSearch.onclick = ()=>{
    searchWord = "";
    searchKey.value = "";
    renderList();
}
//新增弹窗
addBtn.onclick = ()=>{
    popAdd.style.display="block";
    inpParam.value = "";
    inpPurpose.value = "";
    inpResult.value = "";
}
closeAdd.onclick = ()=>popAdd.style.display="none";
saveRecord.onclick = ()=>{
    const param = inpParam.value.trim();
    const purpose = inpPurpose.value.trim();
    const result = inpResult.value.trim();
    const today = new Date().toLocaleDateString();
    // unshift插入数组头部，新增记录直接置顶
    recordList.unshift({date:today, param, purpose, result});
    saveStorage();
    popAdd.style.display="none";
    renderList();
    alert("保存成功，记录已置顶");
}
//导出台账
exportBtn.onclick = ()=>{
    let text = "日期\t参数记录\t试验目的\t试验结果\n";
    recordList.forEach(row=>{
        text += `${row.date}\t${row.param}\t${row.purpose}\t${row.result}\n`
    })
    navigator.clipboard.writeText(text);
    alert("全部台账已复制！粘贴到Excel即可");
}
//汇总文本生成
function buildSummaryText(title, dataList) {
    let output = `${title}\n\n`;
    if(dataList.length === 0){
        output += "选定时间段内无试验记录";
        return output;
    }
    dataList.forEach(item=>{
        output += `【${item.date}】\n`;
        if(item.param.trim()) output += "▶试验参数：\n·"+item.param+"\n";
        if(item.purpose.trim()) output += "\n▶试验目的：\n·"+item.purpose+"\n";
        if(item.result.trim()) output += "\n▶试验结果：\n·"+item.result+"\n";
        output += "\n——————————————\n\n";
    })
    return output;
}
//周报
weekBtn.onclick = ()=>{
    popWeek.style.display="block";
    const now=new Date();
    wEnd.valueAsDate = now;
    let s = new Date();
    s.setDate(now.getDate()-6);
    wStart.valueAsDate = s;
}
closeWeek.onclick = ()=>popWeek.style.display="none";
buildWeek.onclick = ()=>{
    const s = wStart.value;
    const e = wEnd.value;
    if(!s||!e){alert("请选择起止日期");return;}
    let matchData = recordList.filter(item=>{
        const dStr = item.date.replace(/\//g,"-");
        return dStr >= s && dStr <= e;
    });
    const title = `======SOFC试验周报【${s} ~ ${e}】======`;
    weekResult.value = buildSummaryText(title, matchData);
}
copyWeek.onclick = ()=>{
    navigator.clipboard.writeText(weekResult.value);
    alert("周报复制完成");
}
//月报
monthBtn.onclick = ()=>{
    popMonth.style.display="block";
    const now=new Date();
    selMonth.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
}
closeMonth.onclick = ()=>popMonth.style.display="none";
buildMonth.onclick = ()=>{
    const val = selMonth.value;
    if(!val) return;
    const [y,m] = val.split("-");
    let matchData = recordList.filter(item=>{
        const dArr = item.date.split("/");
        return dArr[0]==y && String(Number(dArr[1])).padStart(2,"0")==m;
    });
    const title = `======SOFC试验月报【${y}年${m}月】======`;
    monthResult.value = buildSummaryText(title, matchData);
}
copyMonth.onclick = ()=>{
    navigator.clipboard.writeText(monthResult.value);
    alert("月报复制完成");
}
//初始化渲染
renderList();
</script>
</body>
</html>

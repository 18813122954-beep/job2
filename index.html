<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SOFC工作台账</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, Microsoft Yahei}
body{background:#f5f7fa;color:#222;padding-bottom:80px;min-height:100vh}
.container{max-width:760px;margin:0 auto;padding:12px}

/* 分类标签栏 */
.tab-bar{display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.tab-item{white-space:nowrap;padding:8px 14px;background:#e4e9f2;border-radius:20px;font-size:14px;flex-shrink:0}
.tab-item.active{background:#2980b9;color:#fff}

/* 功能按钮组 */
.btn-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.btn-block{padding:11px;border:none;border-radius:10px;font-size:15px;color:#fff}
.btn-blue{background:#2980b9}
.btn-green{background:#27ae60}
.btn-orange{background:#e67e22}
.btn-gray{background:#95a5a6}
.btn-red{background:#e74c3c}

/* 搜索区域 */
.search-box{display:flex;gap:8px;margin-bottom:14px}
.search-box input{flex:1;padding:10px 12px;border:1px solid #dcdfe6;border-radius:10px;font-size:16px}

/* 记录卡片 */
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 5px #00000010}
.card-date{font-size:13px;color:#777;margin-bottom:6px}
.card-title{font-weight:bold;margin:8px 0 4px}
.card-text{font-size:15px;line-height:1.5;margin-bottom:6px}
.card-del{margin-top:8px;padding:6px 12px;background:#ecf0f1;border:none;border-radius:8px;color:#c0392b}

/* 弹窗通用样式（手机全屏弹窗） */
.pop{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;padding:16px;overflow-y:auto}
.pop-content{background:#fff;border-radius:14px;padding:16px;max-width:720px;margin:0 auto}
.pop h3{margin-bottom:14px}
.pop label{display:block;margin:10px 0 4px;font-weight:500}
.pop textarea{width:100%;min-height:120px;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}
.pop input{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin-bottom:6px}
.pop .line-btn{display:flex;gap:10px;margin-top:16px}
.pop textarea.report{min-height:240px;background:#f7f8fa}
.tip-text{color:#666;font-size:14px;margin:8px 0}
.highlight{background:#fff280}
</style>
</head>
<body>
<div class="container">
    <!-- 顶部分类标签 -->
    <div class="tab-bar" id="tabBar">
        <div class="tab-item" data-cat="电池生产">电池生产</div>
        <div class="tab-item" data-cat="密封生产">密封生产</div>
        <div class="tab-item" data-cat="电堆生产">电堆生产</div>
        <div class="tab-item" data-cat="电池研发">电池研发</div>
        <div class="tab-item" data-cat="密封研发">密封研发</div>
        <div class="tab-item" data-cat="电堆研发">电堆研发</div>
    </div>

    <!-- 搜索 -->
    <div class="search-box">
        <input id="searchKey" placeholder="全局搜索进度、问题、想法">
        <button class="btn-block btn-blue" style="width:90px" id="searchBtn">搜索</button>
    </div>
    <div class="tip-text" id="searchTip"></div>

    <!-- 功能按钮 -->
    <div class="btn-row">
        <button class="btn-block btn-blue" id="addBtn">新增记录</button>
        <button class="btn-block btn-green" id="exportBtn">导出台账</button>
        <button class="btn-block btn-gray" id="resetSearch">清除搜索</button>
    </div>
    <div class="btn-row">
        <button class="btn-block btn-orange" id="weekBtn">生成周报</button>
        <button class="btn-block btn-orange" id="monthBtn">生成月报</button>
        <div></div>
    </div>

    <!-- 记录列表 -->
    <div id="listWrap"></div>
</div>

<!-- 新增记录弹窗 -->
<div class="pop" id="popAdd">
    <div class="pop-content">
        <h3>新增工作记录</h3>
        <label>当日进度</label>
        <textarea id="inpProgress" placeholder="填写当日完成工作"></textarea>
        <label>现存问题</label>
        <textarea id="inpProblem" placeholder="遇到的试验/生产问题"></textarea>
        <label>思路与改善方案</label>
        <textarea id="inpIdea" placeholder="解决方案、后续计划"></textarea>
        <div class="line-btn">
            <button class="btn-block btn-blue" id="saveRecord">保存</button>
            <button class="btn-block btn-gray" id="closeAdd">取消</button>
        </div>
    </div>
</div>

<!-- 周报弹窗 -->
<div class="pop" id="popWeek">
    <div class="pop-content">
        <h3>自动生成周报汇总</h3>
        <label>起始日期</label>
        <input type="date" id="wStart">
        <label>结束日期</label>
        <input type="date" id="wEnd">
        <button class="btn-block btn-blue" style="width:100%;margin:8px 0" id="buildWeek">生成汇总周报</button>
        <textarea readonly class="report" id="weekResult"></textarea>
        <div class="line-btn">
            <button class="btn-block btn-green" id="copyWeek">复制文本</button>
            <button class="btn-block btn-gray" id="closeWeek">关闭</button>
        </div>
    </div>
</div>

<!-- 月报弹窗 -->
<div class="pop" id="popMonth">
    <div class="pop-content">
        <h3>自动生成月报汇总</h3>
        <label>选择月份</label>
        <input type="month" id="selMonth">
        <button class="btn-block btn-blue" style="width:100%;margin:8px 0" id="buildMonth">生成汇总月报</button>
        <textarea readonly class="report" id="monthResult"></textarea>
        <div class="line-btn">
            <button class="btn-block btn-green" id="copyMonth">复制文本</button>
            <button class="btn-block btn-gray" id="closeMonth">关闭</button>
        </div>
    </div>
</div>

<script>
//分类清单
const cats = ["电池生产","密封生产","电堆生产","电池研发","密封研发","电堆研发"];
let activeCat = "电池生产";
let searchWord = "";

//读取本地存储
let storeData = JSON.parse(localStorage.getItem("sofcWorkLog")) || {};
cats.forEach(c=>{if(!storeData[c]) storeData[c]=[]})

//DOM元素
const tabItems = document.querySelectorAll(".tab-item");
const listWrap = document.getElementById("listWrap");
const searchKey = document.getElementById("searchKey");
const searchBtn = document.getElementById("searchBtn");
const resetSearch = document.getElementById("resetSearch");
const searchTip = document.getElementById("searchTip");

const popAdd = document.getElementById("popAdd");
const inpProgress = document.getElementById("inpProgress");
const inpProblem = document.getElementById("inpProblem");
const inpIdea = document.getElementById("inpIdea");
const addBtn = document.getElementById("addBtn");
const saveRecord = document.getElementById("saveRecord");
const closeAdd = document.getElementById("closeAdd");

const exportBtn = document.getElementById("exportBtn");

//周报
const popWeek = document.getElementById("popWeek");
const weekBtn = document.getElementById("weekBtn");
const wStart = document.getElementById("wStart");
const wEnd = document.getElementById("wEnd");
const buildWeek = document.getElementById("buildWeek");
const weekResult = document.getElementById("weekResult");
const copyWeek = document.getElementById("copyWeek");
const closeWeek = document.getElementById("closeWeek");

//月报
const popMonth = document.getElementById("popMonth");
const monthBtn = document.getElementById("monthBtn");
const selMonth = document.getElementById("selMonth");
const buildMonth = document.getElementById("buildMonth");
const monthResult = document.getElementById("monthResult");
const copyMonth = document.getElementById("copyMonth");
const closeMonth = document.getElementById("closeMonth");

//切换分类
tabItems.forEach(t=>{
    t.onclick=()=>{
        tabItems.forEach(ti=>ti.classList.remove("active"));
        t.classList.add("active");
        activeCat = t.dataset.cat;
        searchWord = "";
        searchKey.value = "";
        renderList();
    }
})
document.querySelector(`.tab-item[data-cat="${activeCat}"]`).classList.add("active");

//保存数据
function saveStorage(){
    localStorage.setItem("sofcWorkLog",JSON.stringify(storeData));
}

//文字高亮
function highlight(str,key){
    if(!key) return str;
    return str.replace(new RegExp(`(${key})`,"gi"),`<span class="highlight">$1</span>`);
}

//渲染列表
function renderList(){
    listWrap.innerHTML = "";
    searchTip.innerText = "";
    //搜索模式：全分类检索
    if(searchWord.trim()!=""){
        let result = [];
        cats.forEach(c=>{
            storeData[c].forEach((item,idx)=>{
                const allTxt = (item.progress+item.problem+item.idea).toLowerCase();
                if(allTxt.includes(searchWord.toLowerCase())){
                    result.push({cat:c,idx,item})
                }
            })
        })
        if(result.length===0){
            listWrap.innerHTML = `<div class="card">未搜索到匹配记录</div>`;
            return;
        }
        searchTip.innerText = `搜索【${searchWord}】共找到${result.length}条`;
        result.forEach(row=>renderCard(row.cat,row.idx,row.item,true));
        return;
    }
    //正常浏览当前分类
    const arr = storeData[activeCat];
    if(arr.length===0){
        listWrap.innerHTML = `<div class="card">暂无记录，请点击新增记录</div>`;
        return;
    }
    arr.forEach((item,idx)=>renderCard(activeCat,idx,item,false));
}

//渲染单条卡片
function renderCard(cat,idx,item,showCat){
    const div = document.createElement("div");
    div.className="card";
    div.innerHTML = `
        <div class="card-date">${showCat?"【"+cat+"】":""}${item.date}</div>
        <div class="card-title">进度</div>
        <div class="card-text">${highlight(item.progress||"-",searchWord)}</div>
        <div class="card-title">问题</div>
        <div class="card-text">${highlight(item.problem||"-",searchWord)}</div>
        <div class="card-title">思路方案</div>
        <div class="card-text">${highlight(item.idea||"-",searchWord)}</div>
        <button class="card-del" data-cat="${cat}" data-idx="${idx}">删除本条</button>
    `;
    listWrap.appendChild(div);
}

//删除记录
listWrap.onclick = e=>{
    if(e.target.classList.contains("card-del")){
        const c = e.target.dataset.cat;
        const i = Number(e.target.dataset.idx);
        if(confirm("确定删除这条记录？")){
            storeData[c].splice(i,1);
            saveStorage();
            renderList();
        }
    }
}

//搜索
searchBtn.onclick = ()=>{
    searchWord = searchKey.value.trim();
    renderList();
}
searchKey.onkeydown = e=>{
    if(e.key=="Enter"){
        searchWord = searchKey.value.trim();
        renderList();
    }
}
resetSearch.onclick = ()=>{
    searchWord = "";
    searchKey.value = "";
    renderList();
}

//新增弹窗
addBtn.onclick = ()=>{
    popAdd.style.display="block";
    inpProgress.value = "";
    inpProblem.value = "";
    inpIdea.value = "";
}
closeAdd.onclick = ()=>popAdd.style.display="none";

saveRecord.onclick = ()=>{
    const p = inpProgress.value.trim();
    const pr = inpProblem.value.trim();
    const id = inpIdea.value.trim();
    const today = new Date().toLocaleDateString();
    storeData[activeCat].push({date:today,progress:p,problem:pr,idea:id});
    saveStorage();
    popAdd.style.display="none";
    renderList();
    alert("保存成功");
}

//导出台账
exportBtn.onclick = ()=>{
    let text = "分类\t日期\t进度\t问题\t想法\n";
    cats.forEach(c=>{
        storeData[c].forEach(row=>{
            text += `${c}\t${row.date}\t${row.progress}\t${row.problem}\t${row.idea}\n`
        })
    })
    navigator.clipboard.writeText(text);
    alert("全部台账已复制！");
}

/**
 * 通用汇总生成函数
 * 将筛选出来的数据按分类聚合：工作完成、现存问题、后续计划三大块
 */
function buildSummaryText(title, dataList) {
    //按分类分组
    const group = {};
    cats.forEach(c=>group[c]={progress:[],problem:[],plan:[]});

    dataList.forEach(row=>{
        const cat = row.cat;
        if(row.item.progress.trim()) group[cat].progress.push(row.item.progress.trim());
        if(row.item.problem.trim()) group[cat].problem.push(row.item.problem.trim());
        if(row.item.idea.trim()) group[cat].plan.push(row.item.idea.trim());
    });

    let output = `${title}\n\n`;
    for(let c of cats){
        const g = group[c];
        if(g.progress.length === 0 && g.problem.length ===0 && g.plan.length ===0) continue;

        output += `【${c}】\n`;
        //本周/本月完成工作
        if(g.progress.length>0){
            output += "▶已完成工作：\n";
            g.progress.forEach(txt=>output += `·${txt}\n`);
        }
        //现存问题
        if(g.problem.length>0){
            output += "\n▶现存问题：\n";
            g.problem.forEach(txt=>output += `·${txt}\n`);
        }
        //方案与后续计划
        if(g.plan.length>0){
            output += "\n▶解决方案/后续计划：\n";
            g.plan.forEach(txt=>output += `·${txt}\n`);
        }
        output += "\n";
    }

    if(output.trim() === `${title}`){
        output += "选定时间段内无工作记录";
    }
    return output;
}

//====周报汇总逻辑====
weekBtn.onclick = ()=>{
    popWeek.style.display="block";
    const now=new Date();
    wEnd.valueAsDate = now;
    let s = new Date();
    s.setDate(now.getDate()-6);
    wStart.valueAsDate = s;
}
closeWeek.onclick = ()=>popWeek.style.display="none";
buildWeek.onclick = ()=>{
    const s = wStart.value;
    const e = wEnd.value;
    if(!s||!e){alert("选择起止日期");return;}

    //筛选区间内全部数据
    let matchData = [];
    cats.forEach(c=>{
        storeData[c].forEach(item=>{
            const dStr = item.date.replace(/\//g,"-");
            if(dStr >= s && dStr <= e){
                matchData.push({cat:c,item})
            }
        })
    });
    const title = `======工作周报【${s} ~ ${e}】======`;
    weekResult.value = buildSummaryText(title, matchData);
}
copyWeek.onclick = ()=>{
    navigator.clipboard.writeText(weekResult.value);
    alert("周报复制完成");
}

//====月报汇总逻辑====
monthBtn.onclick = ()=>{
    popMonth.style.display="block";
    const now=new Date();
    selMonth.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
}
closeMonth.onclick = ()=>popMonth.style.display="none";
buildMonth.onclick = ()=>{
    const val = selMonth.value;
    if(!val) return;
    const [y,m] = val.split("-");

    let matchData = [];
    cats.forEach(c=>{
        storeData[c].forEach(item=>{
            const dArr = item.date.split("/");
            if(dArr[0]==y && String(Number(dArr[1])).padStart(2,"0")==m){
                matchData.push({cat:c,item})
            }
        })
    });
    const title = `======工作月报【${y}年${m}月】======`;
    monthResult.value = buildSummaryText(title, matchData);
}
copyMonth.onclick = ()=>{
    navigator.clipboard.writeText(monthResult.value);
    alert("月报复制完成");
}

//初始化渲染
renderList();
</script>
</body>
</html>
